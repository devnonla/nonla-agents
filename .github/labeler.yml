# Rules for auto-labeling Pull Requests based on modified files
# https://github.com/actions/labeler

area/server:
  - changed-files:
      - any-glob-to-any-file: src/server/**

area/web:
  - changed-files:
      - any-glob-to-any-file: src/web/**

area/ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"
          - "**/*.md"
