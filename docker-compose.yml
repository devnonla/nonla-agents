services:
  nonla-agents:
    # Published image — https://hub.docker.com/r/devnonla/nonla-agents
    image: devnonla/nonla-agents:latest
    container_name: nonla-agents
    ports:
      - "8429:8429"
    volumes:
      - nonla-agents-data:/data
    restart: unless-stopped
    # Default DB is SQLite at /data/data.db.
    # Custom tools and site backend.ts workers are sandboxed with bubblewrap
    # (namespace + capability isolation — see src/server/src/common/sandbox/).
    # bwrap needs to call clone()/unshare() to create those namespaces, which
    # Docker's default seccomp profile blocks even for root. This opts the
    # container out of Docker's syscall filter (not out of Linux
    # capabilities/privileges) so bwrap can do its job; without it, children
    # still run, just unsandboxed.
    security_opt:
      - seccomp:unconfined

volumes:
  nonla-agents-data:
